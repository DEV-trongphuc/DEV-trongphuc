<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" fill="none">
  <defs>
    <linearGradient id="oBg" x1="0" y1="0" x2="1100" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#06122E"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="oGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#1E40FF" stroke-opacity="0.16" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.3" fill="#38BDF8" fill-opacity="0.28"/>
    </pattern>
    <clipPath id="oClip"><rect width="1100" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#oClip)">
    <rect width="1100" height="320" fill="url(#oBg)"/>
    <g>
      <rect x="-40" y="-40" width="1180" height="400" fill="url(#oGrid)"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="4s" repeatCount="indefinite"/>
    </g>
    <circle cx="230" cy="160" r="150" fill="url(#sunGlow)"/>

    <g transform="translate(230, 160)">
      <circle r="134" stroke="#1E40FF" stroke-opacity="0.38" stroke-width="1.4" stroke-dasharray="8 6"/>
      <circle r="96" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="14 8"/>
      <circle r="58" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="10 6"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        <circle cx="134" cy="0" r="14" fill="#070E22" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="134" y="4" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="9" font-weight="800">3D</text>
        <circle cx="-134" cy="0" r="14" fill="#070E22" stroke="#10B981" stroke-width="1.5"/>
        <text x="-134" y="4" text-anchor="middle" fill="#34D399" font-family="ui-monospace, monospace" font-size="9" font-weight="800">PG</text>
        <circle cx="0" cy="-134" r="14" fill="#070E22" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="0" y="-130" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="9" font-weight="800">AI</text>
        <circle cx="0" cy="134" r="14" fill="#070E22" stroke="#A78BFA" stroke-width="1.5"/>
        <text x="0" y="138" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="9" font-weight="800">GO</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
        <circle cx="96" cy="0" r="13" fill="#070E22" stroke="#60A5FA" stroke-width="1.5"/>
        <text x="96" y="4" text-anchor="middle" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="8.5" font-weight="800">TS</text>
        <circle cx="-96" cy="0" r="13" fill="#070E22" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="-96" y="4" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="800">JS</text>
        <circle cx="0" cy="-96" r="13" fill="#070E22" stroke="#34D399" stroke-width="1.5"/>
        <text x="0" y="-92" text-anchor="middle" fill="#34D399" font-family="ui-monospace, monospace" font-size="8" font-weight="800">NJS</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.5s" repeatCount="indefinite"/>
        <circle cx="58" cy="0" r="6" fill="#38BDF8"/>
        <circle cx="-58" cy="0" r="6" fill="#F59E0B"/>
      </g>
      <circle r="34" fill="#1E40FF" stroke="#38BDF8" stroke-width="2"/>
      <text x="0" y="-2" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="900">STACK</text>
      <text x="0" y="12" text-anchor="middle" fill="#BAE6FD" font-family="ui-monospace, monospace" font-size="9" font-weight="700">CORE</text>
    </g>

    <text x="430" y="54" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="2.5">ENGINEERING CAPABILITIES &amp; ARCHITECTURE STACK</text>

    <g transform="translate(430, 78)">
      <text x="0" y="16" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Frontend, WebGL 3D &amp; UI Systems (React 19 · Next.js · Three.js · Tailwind)</text>
      <rect x="0" y="26" width="620" height="10" rx="5" fill="#070E22" stroke="#1E3A8A"/>
      <rect x="0" y="26" width="590" height="10" rx="5" fill="#38BDF8"><animate attributeName="width" values="0;590" dur="1.4s" fill="freeze"/></rect>
    </g>
    <g transform="translate(430, 134)">
      <text x="0" y="16" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Multi-Tenant Backend &amp; RLS Security (Node · Express · PostgreSQL · BullMQ)</text>
      <rect x="0" y="26" width="620" height="10" rx="5" fill="#070E22" stroke="#1E3A8A"/>
      <rect x="0" y="26" width="575" height="10" rx="5" fill="#1E40FF"><animate attributeName="width" values="0;575" dur="1.6s" fill="freeze"/></rect>
    </g>
    <g transform="translate(430, 190)">
      <text x="0" y="16" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">AI Agents, Vision CAD &amp; RAG Pipelines (Gemini · SAM 3 · ViTMatte · OCR)</text>
      <rect x="0" y="26" width="620" height="10" rx="5" fill="#070E22" stroke="#1E3A8A"/>
      <rect x="0" y="26" width="560" height="10" rx="5" fill="#A78BFA"><animate attributeName="width" values="0;560" dur="1.8s" fill="freeze"/></rect>
    </g>
    <g transform="translate(430, 246)">
      <text x="0" y="16" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">FinTech Webhooks, Real-Time Messaging &amp; Cloud (VietQR ACB · Zalo · Docker)</text>
      <rect x="0" y="26" width="620" height="10" rx="5" fill="#070E22" stroke="#1E3A8A"/>
      <rect x="0" y="26" width="580" height="10" rx="5" fill="#10B981"><animate attributeName="width" values="0;580" dur="2.0s" fill="freeze"/></rect>
    </g>

    <rect x="-280" y="1.5" width="280" height="2.2" fill="url(#oScan)"><animate attributeName="x" from="-280" to="1100" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="1100" y="316.5" width="280" height="2.2" fill="url(#oScan)"><animate attributeName="x" from="1100" to="-280" dur="3.7s" repeatCount="indefinite"/></rect>
  </g>
  <rect width="1100" height="320" rx="20" stroke="#1E3A8A" stroke-width="1.6"/>
  <path d="M14 36 V14 H36" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M1086 36 V14 H1064" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 284 V306 H36" stroke="#1E40FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M1086 284 V306 H1064" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
</svg>
