    </rect>
    <text x="18" y="34" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">REALTIME &amp; OSS CODE</text>
    <text x="18" y="72" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="30" font-weight="900">&lt;5s · 69 Repos</text>
    <text x="18" y="96" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">VietQR ACB · ZaloBot · 30+ Clients</text>
    <g transform="translate(210, 20)">
      <rect x="0" y="6" width="4" height="16" rx="2" fill="#FBBF24"><animate attributeName="height" values="12;18;6;16;12" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="8;2;14;4;8" dur="0.95s" repeatCount="indefinite"/></rect>
      <rect x="7" y="10" width="4" height="12" rx="2" fill="#F59E0B"><animate attributeName="height" values="6;16;8;18;6" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="14;4;12;2;14" dur="1.15s" repeatCount="indefinite"/></rect>
      <rect x="14" y="4" width="4" height="18" rx="2" fill="#FDE68A"><animate attributeName="height" values="18;8;16;6;18" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="2;12;4;14;2" dur="1.05s" repeatCount="indefinite"/></rect>
      <rect x="21" y="8" width="4" height="14" rx="2" fill="#FBBF24"><animate attributeName="height" values="8;18;12;6;8" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="12;2;8;14;12" dur="1.25s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
