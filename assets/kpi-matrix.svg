    </rect>
    <text x="18" y="34" fill="#A78BFA" font-family="ui-monospace, monospace" font-size="11" font-weight="700">AI AGENTS &amp; WEBGL 3D</text>
    <text x="18" y="72" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="30" font-weight="900">208 SKU 3D</text>
    <text x="18" y="96" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">6 Prepress Agents · Three.js · RAG</text>
    <g transform="translate(206, 20)">
      <rect x="0" y="8" width="4" height="14" rx="2" fill="#A78BFA"><animate attributeName="height" values="10;18;6;14;10" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="10;2;14;6;10" dur="1.25s" repeatCount="indefinite"/></rect>
      <rect x="7" y="4" width="4" height="18" rx="2" fill="#C4B5FD"><animate attributeName="height" values="6;16;12;18;6" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="14;4;8;2;14" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="14" y="10" width="4" height="12" rx="2" fill="#7C3AED"><animate attributeName="height" values="16;6;18;8;16" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="4;14;2;12;4" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="21" y="6" width="4" height="16" rx="2" fill="#A78BFA"><animate attributeName="height" values="8;18;10;14;8" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="12;2;10;6;12" dur="1.05s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- Card 4: REALTIME & FINTECH -->
  <g transform="translate(830, 12)">
    <rect width="262" height="114" rx="16" fill="url(#cBg)" stroke="#D97706" stroke-width="1.5"/>
    <rect width="262" height="114" rx="16" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="60 680" stroke-dashoffset="-555">
