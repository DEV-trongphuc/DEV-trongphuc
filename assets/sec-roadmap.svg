<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 84" width="100%" fill="none">
  <defs>
    <linearGradient id="sec_roadmap_bg" x1="0" y1="0" x2="1100" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#06122E"/>
    </linearGradient>
    <radialGradient id="sec_roadmap_aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#1E40FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sec_roadmap_scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sec_roadmap_grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#1E40FF" stroke-opacity="0.16" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.25" fill="#38BDF8" fill-opacity="0.28"/>
    </pattern>
    <clipPath id="sec_roadmap_clip">
      <rect width="1100" height="84" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#sec_roadmap_clip)">
    <rect width="1100" height="84" fill="url(#sec_roadmap_bg)"/>
    <g>
      <rect x="-40" y="-40" width="1180" height="164" fill="url(#sec_roadmap_grid)"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="4.2s" repeatCount="indefinite"/>
    </g>
    <circle cx="46" cy="42" r="14" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 3">
      <animateTransform attributeName="transform" type="rotate" from="0 46 42" to="360 46 42" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="42" r="5" fill="#F59E0B">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="31" fill="#F59E0B" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" letter-spacing="2.8">LAYER 05 // PRODUCT HORIZON</text>
    <text x="76" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="900">2026 SOFTWARE ENGINEERING ROADMAP</text>
    <g transform="translate(996, 30)">
      <rect x="0" y="10" width="5" height="16" rx="2.5" fill="#1E40FF"><animate attributeName="height" values="6;20;8;16;6" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="16;2;14;6;16" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="9" y="4" width="5" height="22" rx="2.5" fill="#F59E0B"><animate attributeName="height" values="18;6;22;10;18" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="4;16;0;12;4" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="18" y="8" width="5" height="18" rx="2.5" fill="#10B981"><animate attributeName="height" values="10;22;6;18;10" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="12;0;16;4;12" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="27" y="6" width="5" height="20" rx="2.5" fill="#F59E0B"><animate attributeName="height" values="16;8;20;6;16" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="6;14;2;16;6" dur="1.0s" repeatCount="indefinite"/></rect>
      <rect x="36" y="11" width="5" height="14" rx="2.5" fill="#F59E0B"><animate attributeName="height" values="8;20;10;16;8" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="14;2;12;6;14" dur="1.2s" repeatCount="indefinite"/></rect>
    </g>
    <rect x="-280" y="1.5" width="280" height="2.2" fill="url(#sec_roadmap_scan)">
      <animate attributeName="x" from="-280" to="1100" dur="2.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="1100" y="80.5" width="280" height="2.2" fill="url(#sec_roadmap_scan)">
      <animate attributeName="x" from="1100" to="-280" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect width="1100" height="84" rx="16" stroke="#1E3A8A" stroke-width="1.6"/>
  <path d="M14 36 V14 H36" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M1086 36 V14 H1064" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 48 V70 H36" stroke="#1E40FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M1086 48 V70 H1064" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
</svg>