<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 170" width="100%" fill="none">
  <defs>
    <linearGradient id="footer_bg" x1="0" y1="0" x2="1100" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#06122E"/>
    </linearGradient>
    <radialGradient id="footer_aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#1E40FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="footer_scan" x1="0" y1="0" x2="1" y2="0">
