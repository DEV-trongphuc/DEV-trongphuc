      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#06122E"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="rScan" x1="0" y1="0" x2="1" y2="0">
