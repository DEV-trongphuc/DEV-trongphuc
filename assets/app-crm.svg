<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 462" width="100%" fill="none">
  <defs>
    <linearGradient id="app-crm_bg" x1="0" y1="0" x2="540" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#06122E"/>
    </linearGradient>
    <radialGradient id="app-crm_aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#1E40FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="app-crm_scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="app-crm_grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#1E40FF" stroke-opacity="0.16" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.25" fill="#38BDF8" fill-opacity="0.28"/>
    </pattern>
    <clipPath id="app-crm_clip">
      <rect width="540" height="462" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#app-crm_clip)">
    <rect width="540" height="462" fill="url(#app-crm_bg)"/>
    <g>
      <rect x="-40" y="-40" width="620" height="542" fill="url(#app-crm_grid)"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="3.8s" repeatCount="indefinite"/>
    </g>
    <defs>
      <clipPath id="app-crm_imgclip">
        <rect x="18" y="46" width="504" height="232" rx="12"/>
      </clipPath>
    </defs>

    <!-- Card Header Status Bar -->
    <circle cx="28" cy="24" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="42" y="28" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1.8">SALES &amp; B2B · PIPELINE OS</text>
    <rect x="412" y="13" width="110" height="22" rx="11" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
    <text x="467" y="28" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="10" font-weight="700">CRM 360°</text>

    <!-- Real Production App Screenshot inside Cyber Frame -->
    <rect x="16" y="44" width="508" height="236" rx="13" fill="#020617" stroke="#34D399" stroke-opacity="0.65" stroke-width="1.5"/>
    <image href="data:image/webp;base64," x="18" y="46" width="504" height="232" preserveAspectRatio="xMidYMin slice" clip-path="url(#app-crm_imgclip)"/>

    <!-- Live Laser Scanner Sweeping Across Real Screenshot -->
    <g clip-path="url(#app-crm_imgclip)">
      <rect x="-120" y="46" width="120" height="232" fill="url(#app-crm_scan)" opacity="0.32">
        <animate attributeName="x" from="-120" to="540" dur="3.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- App Title & Stack -->
    <text x="20" y="309" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="900">DOMATION CRM 360° &amp; Deals Kanban</text>
    <text x="20" y="330" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">Pipeline 8 Nấc · Live Inventory · Quotes · Deposits · PII RBAC</text>

    <!-- 3 Key Bullet Highlights -->
    <circle cx="24" cy="354" r="3" fill="#34D399"/><text x="36" y="358" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">Hồ sơ khách hàng 360° Timeline đa tab, Deals B2B &amp; Hoạt động</text>
    <circle cx="24" cy="378" r="3" fill="#34D399"/><text x="36" y="382" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">Rổ hàng live, Báo giá SKU, Đặt cọc đa đợt &amp; Phiếu chia hoa hồng</text>
    <circle cx="24" cy="402" r="3" fill="#34D399"/><text x="36" y="406" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">Lọc trùng đa nguồn, Che PII theo RBAC &amp; Đồng bộ hóa đơn ĐT</text>

    <!-- Bottom Action CTA Strip -->
    <rect x="20" y="418" width="500" height="30" rx="8" fill="#0B193D" stroke="#34D399" stroke-opacity="0.8" stroke-width="1"/>
    <text x="34" y="437" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">https://crm-domation.vercel.app/</text>
    <text x="506" y="437" text-anchor="end" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">MỞ ỨNG DỤNG →</text>
    <rect x="-280" y="1.5" width="280" height="2.2" fill="url(#app-crm_scan)">
      <animate attributeName="x" from="-280" to="540" dur="3.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="540" y="458.5" width="280" height="2.2" fill="url(#app-crm_scan)">
      <animate attributeName="x" from="540" to="-280" dur="3.7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect width="540" height="462" rx="18" stroke="#34D399" stroke-width="1.6"/>
  <path d="M14 36 V14 H36" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M526 36 V14 H504" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 426 V448 H36" stroke="#1E40FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M526 426 V448 H504" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
</svg>