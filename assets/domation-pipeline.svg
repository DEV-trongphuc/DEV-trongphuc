<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="55%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#091534"/>
    </linearGradient>
    <linearGradient id="pipeBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E40FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="pipeEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="pipeGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38BDF8" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1100" height="320" rx="18" fill="url(#bg)" stroke="#1E3A8A" stroke-width="1.5"/>
  <rect width="1100" height="320" rx="18" fill="url(#dots)"/>

  <text x="550" y="34" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="3">DOMATION REAL-TIME ARCHITECTURE  ·  END-TO-END GROWTH ENGINE</text>

  <!-- Animated Flow Paths -->
  <path id="p1" d="M 240 112 C 295 112, 305 160, 360 160" stroke="url(#pipeBlue)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path id="p2" d="M 240 208 C 295 208, 305 160, 360 160" stroke="url(#pipeBlue)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path id="p3" d="M 600 160 C 660 160, 665 104, 725 104" stroke="url(#pipeEmerald)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path id="p4" d="M 600 160 C 660 160, 665 216, 725 216" stroke="url(#pipeGold)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path id="p5" d="M 885 256 C 885 288, 130 288, 130 248" stroke="#F59E0B" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- Moving Glowing Light Packets -->
  <circle r="5" fill="#38BDF8">
    <animateMotion dur="1.9s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
  </circle>
  <circle r="5" fill="#60A5FA">
    <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
  </circle>
  <circle r="5" fill="#10B981">
    <animateMotion dur="1.7s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion>
  </circle>
  <circle r="5" fill="#FBBF24">
    <animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion>
  </circle>
  <circle r="4.5" fill="#F59E0B">
    <animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion>
  </circle>

  <!-- Column 1: Traffic & Web 3D -->
  <g transform="translate(36, 74)">
    <rect width="204" height="76" rx="12" fill="#0F172A" stroke="#1E40FF" stroke-width="1.5"/>
    <text x="16" y="28" fill="#60A5FA" font-family="ui-monospace, monospace" font-size="11" font-weight="700">01 · ACQUISITION</text>
    <text x="16" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Meta · Google · TikTok</text>
    <text x="16" y="66" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Lead Form · Webhook · QR OOH</text>
  </g>
  <g transform="translate(36, 170)">
    <rect width="204" height="76" rx="12" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
    <text x="16" y="28" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">02 · PROPTECH &amp; AI</text>
    <text x="16" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">WebGL 3D &amp; AI Agents</text>
    <text x="16" y="66" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Three.js Draco · AI Prepress CAD</text>
  </g>

  <!-- Column 2: DOMATION Core Engine -->
  <g transform="translate(360, 96)">
    <rect width="240" height="128" rx="16" fill="#0B193D" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="216" cy="24" r="5" fill="#10B981">
      <animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="32" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="12" font-weight="700">CORE KERNEL (RLS + PG)</text>
    <text x="20" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="19" font-weight="800">DOMATION ROUTER</text>
    <text x="20" y="84" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• 6-Month Dedup &amp; AI Pre-screener</text>
    <text x="20" y="102" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• 5-Port Fair-Share &amp; Auto-Recall</text>
    <text x="20" y="118" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">SLA &lt; 5s · 1:1 Fault Ticket Credit</text>
  </g>

  <!-- Column 3: Distribution & Feedback Loop -->
  <g transform="translate(725, 66)">
    <rect width="338" height="76" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="18" y="28" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">03 · OMNI DELIVERY &amp; CRM/ERP</text>
    <text x="18" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">ZaloBot · ZNS · Email SES · ERP 5.0</text>
    <text x="18" y="66" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">3 F1 Agencies ~0% Skew · VietQR ACB · GPS Payroll</text>
  </g>
  <g transform="translate(725, 178)">
    <rect width="338" height="76" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="18" y="28" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">04 · CLOSED-LOOP ATTRIBUTION</text>
    <text x="18" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Meta CAPI SHA-256 &amp; Hook Rate BI</text>
    <text x="18" y="66" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Server-Side Events (HTTP 200) → Re-train Ad Bid</text>
  </g>

  <text x="550" y="302" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">⟲ REAL-TIME REVENUE SIGNAL FEEDBACK LOOP (GTM SERVER + CAPI)</text>
</svg>
